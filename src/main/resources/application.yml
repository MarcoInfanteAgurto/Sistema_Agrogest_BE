server:
  port: 8082
  error:
    include-message: always
  cors:
    allowed-origins: "http://localhost:4200"
    allowed-methods: "*"
    allowed-headers: "*"

spring:
  application:
    name: parcel-service

  # Conexión a la base de datos usando variables de entorno
  datasource:
    # El formato es ${VARIABLE_ENTORNO:valor_por_defecto}
    url: jdbc:postgresql://ep-icy-cloud-anu9v94b-pooler.c-6.us-east-1.aws.neon.tech/parceldb?sslmode=require
    username: neondb_owner
    password: npg_sljYkGJve67x
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Esto convierte nombres de Java 'parcelId' a 'parcel_id' en la DB
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  # Configuración de Kafka (opcional si lo usas)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}